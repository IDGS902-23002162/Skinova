name: Despliegue Automatico Skinova

on:
  push:
    branches:
      - main # Se activa solo al empujar a main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Conectar al servidor y actualizar el codigo
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # 1. Navegar a la carpeta del proyecto
          cd ~/Skinova
          
          # 2. Descargar los ultimos cambios de main
          git pull origin main
          
          # Nota: Mas adelante, aquí mismo agregaremos comandos como:
          # sudo systemctl restart nginx
          # sudo systemctl restart skinova-backend